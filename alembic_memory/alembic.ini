[alembic]
# Путь к папке с миграциями (относительно корня проекта, откуда запускаем команду)
script_location = alembic_memory
prepend_sys_path = .
version_path_separator = os

# Строка подключения к БД memory (асинхронный драйвер asyncpg)
sqlalchemy.url = postgresql+asyncpg://mako:461Tndh119537@localhost:5432/memory

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
