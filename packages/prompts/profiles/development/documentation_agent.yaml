id: documentation_agent
display_name: "Documentation Agent"
contour: development

prompt:
  base_template: "base_developer.jinja2"
  agent_template: "documentation_agent.jinja2"
  role: "Documentation Agent"

capabilities:
  tools:
    - read_file
    - write_file
  allow_rag: false
  allow_web: false
  allow_memory_write: false

execution:
  schema: "one_agent"
  model: "qwen/qwen3.7-max"
  temperature: 0.2
  max_retries: 2