id: brand_agent
display_name: "Brand Agent"
contour: content

prompt:
  base_template: "base_developer.jinja2"
  agent_template: "brand_agent.jinja2"
  role: "Brand Agent"

capabilities:
  tools:
    - search_memory
  allow_rag: false
  allow_web: false
  allow_memory_write: false

execution:
  schema: "one_agent"
  model: "qwen/qwen3.7-max"
  temperature: 0.2
  max_retries: 2