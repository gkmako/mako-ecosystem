id: seo_agent
display_name: "SEO Agent"
contour: business

prompt:
  base_template: "base_developer.jinja2"
  agent_template: "seo_agent.jinja2"
  role: "SEO Agent"

capabilities:
  tools:
    - web_search
  allow_rag: false
  allow_web: true
  allow_memory_write: false

execution:
  schema: "one_agent"
  model: "qwen/qwen3.7-max"
  temperature: 0.2
  max_retries: 2