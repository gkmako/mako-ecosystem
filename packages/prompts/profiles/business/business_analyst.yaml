id: business_analyst
display_name: "Business Analyst Agent"
contour: business

prompt:
  base_template: "base_developer.jinja2"
  agent_template: "business_analyst.jinja2"
  role: "Business Analyst Agent"

capabilities:
  tools:
    - get_project_structure
    - search_memory
    - save_to_memory
  allow_rag: false
  allow_web: false
  allow_memory_write: true

execution:
  schema: "two_agent"
  model: "deepseek/deepseek-v4-pro"
  temperature: 0.2
  max_retries: 2
  reviewer:
    model: "deepseek/deepseek-v4-pro"
    domain: "Business Analysis"
    checks:
      - "полноту требований, логическую непротиворечивость, трассируемость, реализуемость и отсутствие пропущенных бизнес-сценариев"
