id: ai_solution_architect
display_name: "AI Solution Architect"
contour: architecture

prompt:
  base_template: "base_developer.jinja2"
  agent_template: "ai_solution_architect.jinja2"
  role: "AI Solution Architect"

capabilities:
  tools:
    - check_tech_compatibility
    - search_memory
    - save_to_memory
  allow_rag: false
  allow_web: false
  allow_memory_write: true

execution:
  schema: "two_agent"
  model: "deepseek/deepseek-v4-pro"
  temperature: 0.2
  max_retries: 2
  reviewer:
    model: "deepseek/deepseek-v4-pro"
    domain: "AI Architecture"
    checks:
      - "корректность архитектуры AI-системы, взаимодействие компонентов, масштабируемость, стоимость эксплуатации, безопасность, использование LLM, RAG и MCP"
